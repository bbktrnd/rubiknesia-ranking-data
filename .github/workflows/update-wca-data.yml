name: Update WCA Data

on:

  workflow_dispatch:

  schedule:

    - cron: "20 3 * * *"


permissions:

  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 1


      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      - name: Process latest WCA export

        run: |

          python processor.py


      - name: Check for changes

        id: changes

        run: |

          git add data

          if git diff --cached --quiet
          then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      - name: Commit updated WCA data

        if: steps.changes.outputs.changed == 'true'

        run: |

          git config user.name "Rubiknesia Data Bot"

          git config user.email "actions@users.noreply.github.com"

          git commit -m "Update WCA data"

          git push
